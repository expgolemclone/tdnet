[project]
name = "tdnet-viewer"
version = "0.1.0"
description = "TDNet timely disclosure PDF viewer with vim-like keybindings"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.31,<3",
    "flask>=3.0,<4",
    "truststore>=0.10,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
